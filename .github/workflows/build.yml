name: Vmers CI/CD Build Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-core-engine:
    name: Build Native ARM64 Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu p7zip-full

      - name: Compile Native Core Engine
        run: |
          cd core_engine
          make arm64 host

      - name: Upload Core Engine Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmers-core-engine-arm64
          path: core_engine/vmers_engine_arm64

  build-android-app:
    name: Build Android Host Application (Vmers.apk)
    runs-on: ubuntu-latest
    needs: build-core-engine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Grant Execute Permission for Gradlew
        run: |
          cd host_app
          chmod +x gradlew || true

      - name: Build Android APK
        run: |
          cd host_app
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vmers-Debug-APK
          path: host_app/app/build/outputs/apk/debug/*.apk
